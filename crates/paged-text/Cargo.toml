[package]
name = "paged-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Text engine: shaping (harfrust), Knuth-Plass line breaking, hyphenation, composition."

[lints]
workspace = true

[dependencies]
paged-scene = { path = "../paged-scene" }
# Shaping engine (rustybuzz's official successor on the fontations
# stack). ttf-parser stays alongside it for metric/table reads — the
# two share the same font bytes via `shape::Face`.
harfrust = "0.13"
ttf-parser = "0.25"
paragraph-breaker = "0.4"
hypher = "0.1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
blake3 = "1"
