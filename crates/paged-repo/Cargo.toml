[package]
name = "paged-repo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The paged repository: content-addressed parts, commits, refs and evidence; files are projections (ADR 180)."

[lints]
workspace = true

[dependencies]
blake3 = "1"
fastcdc = "5"
# zip's `deflate-flate2` names no backend: list flate2 beside it (see the root Cargo.toml).
flate2 = { workspace = true }
miniz_oxide = "0.8"
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
thiserror = { workspace = true }
zip = { workspace = true }
