name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Resolve the pinned toolchain ONCE from rust-toolchain.toml (audit B21)
  # so every downstream job installs the same version the file pins
  # (channel = "1.94.1") instead of drifting on `@stable`.
  toolchain:
    name: resolve pinned toolchain
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.pin.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "channel=$(bash scripts/rust-channel.sh)" >> "$GITHUB_OUTPUT"

  check:
    name: check + test
    needs: toolchain
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned from rust-toolchain.toml via the toolchain job (B21).
          toolchain: ${{ needs.toolchain.outputs.channel }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # core is PUBLIC and must build standalone, so it keeps its own
      # copies of the shared OFL faces rather than depending on the
      # private corpus. That duplication drifted the first day it
      # existed. This verifies core's bytes against the corpus's
      # published manifest — no private access, and a mismatch fails
      # here instead of surfacing later as a silently substituted font
      # in a fidelity diff.
      - name: font corpus has not drifted
        run: bash scripts/check-font-hashes.sh

      # Several tests read the gitignored corpus/generated/*.idml fixtures
      # (inspector_wire, round-trip, conformance) and panic with "read
      # fixture: NotFound" if they're absent — CI must regenerate them, the
      # same `paged-gen emit` dance local dev does before running tests.
      - name: regenerate fixtures
        run: bash scripts/regen-fixtures.sh

      # Colour tests need a CMYK profile or they skip. Before 2026-08-19 no
      # .icc existed anywhere in the workspace and ~8 tests across the qcms
      # engine, CMYK export, PDF/X-4, ink coverage and soft-proofing printed
      # "skipping" and passed. Fetching one here is what makes them assert on
      # a runner (a designer's Mac finds Adobe's profiles instead). Not a hard
      # failure: if the fetch dies the tests degrade to the loud skip they had
      # before, rather than turning an upstream outage into a red build.
      - name: fetch CMYK profile for the colour tests
        run: bash scripts/fetch-profiles.sh || echo "::warning title=colour tests degraded::profile fetch failed — colour tests will skip this run"

      # --no-fail-fast: a fail-fast abort silently SKIPS every binary after
      # the first failure and reads as "the rest were green" in a truncated
      # log — that combination hid a second, unrelated failure twice on
      # 2026-08-18 (coverage campaign, suite-integrity rule). The step's own
      # exit code is the gate; never pipe this through tail/grep.
      - name: test
        run: cargo test --workspace --no-fail-fast

  # W0.6 evidence (audit V26): run the workspace suite under cargo-nextest
  # with JUnit output and publish normalized results to paged-media/state
  # via the shared publish-results action (mirrors plugin-draw's vitest.yml
  # + editor's tests.yml: source `core`, junit format, map:true against the
  # state repo's test-map). The suite name `nextest-unit` is the one the
  # state repo registers for (source=core) in ingest/suites.yaml — using
  # the registered name is load-bearing: publish-results' convert step
  # requires the (source,suite) pair to exist there. Degrades gracefully
  # when STATE_DISPATCH_TOKEN is unset — the suite still runs and the JUnit
  # uploads; only the cross-repo dispatch is skipped.
  nextest:
    name: nextest evidence
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2

      - name: install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Same fixture dependency as the `test` job above — the nextest run
      # reads the gitignored generated IDMLs, so regenerate first.
      - name: regenerate fixtures
        run: bash scripts/regen-fixtures.sh

      - name: nextest (workspace) → JUnit
        # Red results must still publish (the state matrix wants the ✗),
        # so don't let a test failure abort before the JUnit emits.
        # nextest writes target/nextest/ci/junit.xml when [profile.ci]
        # carries `junit.path` (see .config/nextest.toml).
        run: cargo nextest run --workspace --profile ci || true

      - name: upload JUnit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14

      # NOTE: core is a PUBLIC repo; the publish-results action lives in the
      # PRIVATE state repo, and GitHub blocks a public workflow from
      # resolving a private repo's action (it would leak private action code
      # into public logs) — "Unable to resolve action paged-media/state".
      # So core evidence is NOT pushed from here; the `nextest-junit`
      # artifact above is the hand-off. Private state CAN read this public
      # repo's artifacts, so the ingest direction is inverted: a state-side
      # job pulls the latest core `nextest-junit` artifact (gh API) and runs
      # convert/gate/ingest there. (Editor + plugin repos are private, so
      # they keep using the action directly.) Tracked as a state follow-up.

  # Wasm-lane placeholder (W0.8 substance lands crate-side): invoke the
  # Makefile `test-wasm` target, which calls scripts/test-wasm.sh. That
  # script is a STUB exiting 0 (pending W0.8) until the sibling replaces
  # it with the real headless wasm-test runner.
  test-wasm:
    name: wasm test lane (stub, pending W0.8)
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # scripts/test-wasm.sh runs the wasm-bindgen tests node-hosted, so it
      # needs wasm-bindgen-test-runner (shipped by wasm-bindgen-cli, pinned
      # to the lockfile version) + node on PATH. Without these the lane
      # failed "wasm-bindgen-test-runner not found".
      - name: install wasm-bindgen-cli (lockfile pin)
        run: |
          set -euo pipefail
          WB=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = "|"/,""); print; exit}' Cargo.lock)
          echo "wasm-bindgen pin: $WB"
          cargo install wasm-bindgen-cli --version "$WB" --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: make test-wasm
        run: make test-wasm

  wasm-size:
    name: wasm-size gate (Spike C)
    needs: [toolchain, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Pin binaryen (NOT apt's — ubuntu ships v108, too old to validate
      # wasm-bindgen's reference-types output: "error validating input").
      # Same pin publish-wasm.yml uses. brotli from apt is fine.
      - name: install binaryen (pinned) + brotli
        # BOUNDED, and apt only when actually needed. `apt-get update`
        # here was unbounded, and on 2026-08-19 it hung this job for 70+
        # minutes against a normal runtime of under three — the same
        # failure that had the editor's Playwright lane stuck in apt for
        # a month (its `playwright install --with-deps` ran the job's
        # full 50-minute timeout on every attempt). GitHub's Ubuntu
        # runners were intermittently unable to reach the archive that
        # day; azure.archive.ubuntu.com answers with `Ign:` and apt then
        # sits there.
        #
        # So: skip apt entirely when brotli is already on the image, and
        # bound the step so a hang reports AS a hang instead of eating
        # the job.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if command -v brotli >/dev/null 2>&1; then
            echo "brotli already present ($(command -v brotli)) — skipping apt"
          else
            sudo apt-get update && sudo apt-get install -y brotli
          fi
          BINARYEN=126
          curl -fsSL -o /tmp/binaryen.tgz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN}/binaryen-version_${BINARYEN}-x86_64-linux.tar.gz"
          tar -xzf /tmp/binaryen.tgz -C /tmp
          echo "/tmp/binaryen-version_${BINARYEN}/bin" >> "$GITHUB_PATH"
      - name: measure
        run: ./spikes/wasm-size/measure.sh
      - name: enforce 3.5 MB budget
        run: |
          SIZE=$(stat -c '%s' spikes/wasm-size/out/spike_wasm_size.opt.wasm.br)
          echo "compressed size: $SIZE bytes"
          if [ "$SIZE" -gt 3670016 ]; then
            echo "::error::WASM compressed size $SIZE exceeds 3.5 MB budget"
            exit 1
          fi

  # W0.9 tag-on-bump nudge (protocol-governance §4): a protocol bump on
  # main without a matching `v0.<P>.*` tag is an unpublished engine — the
  # editor can't pin it. This greps the canonical PROTOCOL_VERSION const
  # and warn-annotates (never fails) when no tag exists for that protocol
  # on a main push. Promotion to a hard gate is a later flip.
  tag-on-bump:
    name: tag-on-bump nudge
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags for `git tag -l`
      - name: warn if PROTOCOL_VERSION is unpublished (no matching tag)
        run: |
          set -euo pipefail
          CHANNEL=crates/paged-canvas/src/channel.rs
          # PROTOCOL_VERSION: ProtocolVersion(34);  →  34
          P=$(grep -E 'pub const PROTOCOL_VERSION: ProtocolVersion = ProtocolVersion\(' "$CHANNEL" \
                | head -n1 | sed -E 's/.*ProtocolVersion\(([0-9]+)\).*/\1/')
          if [ -z "$P" ]; then
            echo "::warning::could not parse PROTOCOL_VERSION from $CHANNEL — skipping tag-on-bump check"
            exit 0
          fi
          echo "PROTOCOL_VERSION = $P"
          git fetch --tags --quiet || true
          if [ -n "$(git tag -l "v0.${P}.*")" ]; then
            echo "tag-on-bump ok — a v0.${P}.* tag exists; protocol $P is publishable."
          else
            echo "::warning title=Unpublished protocol::PROTOCOL_VERSION is $P but no v0.${P}.* tag exists. Tag \`v0.${P}.<patch>\` to publish the engine packages the editor pins (protocol-governance §4)."
          fi

  # Audit G1 — the HARD gate the warn-only nudge above should have been:
  # during the 2026 npm-token outage NINE protocol bumps (52–60) merged
  # to main untagged and the nudge's warnings scrolled by unread
  # (recovered at v0.61.0). Governance (protocol-governance, "Release
  # coupling"): a protocol bump on main without its `v0.<P>.*` tag is an
  # unpublished engine the editor cannot pin. So: when a push to main
  # CHANGES PROTOCOL_VERSION, the matching tag must exist or this job
  # FAILS. Pushes that leave the constant alone pass untouched — the
  # standing-state warning stays with tag-on-bump.
  protocol-tag-guard:
    name: protocol-tag-guard
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the push-range diff + tags
      - name: fail if this push bumps PROTOCOL_VERSION without its tag
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          CHANNEL=crates/paged-canvas/src/channel.rs
          proto_at() {  # PROTOCOL_VERSION at a git rev; "" when unparseable/absent
            git show "$1:$CHANNEL" 2>/dev/null \
              | grep -E 'pub const PROTOCOL_VERSION: ProtocolVersion = ProtocolVersion\(' \
              | head -n1 | sed -E 's/.*ProtocolVersion\(([0-9]+)\).*/\1/' || true
          }
          NEW=$(proto_at HEAD)
          if [ -z "$NEW" ]; then
            echo "::warning::could not parse PROTOCOL_VERSION at HEAD — skipping protocol-tag-guard"
            exit 0
          fi
          # Push-range base: github.event.before — unless this is a first
          # push (all-zero SHA) or a force-push whose old tip is gone from
          # the repo; then fall back to HEAD~1 (best available base; a
          # root commit has none, so OLD stays empty and counts as a
          # change, which is the safe direction).
          if [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE=$(git rev-parse --verify -q HEAD~1 || true)
          fi
          OLD=""
          if [ -n "$BEFORE" ]; then
            OLD=$(proto_at "$BEFORE")
          fi
          echo "PROTOCOL_VERSION: '${OLD:-<none>}' → '${NEW}' (push base: ${BEFORE:-<none>})"
          if [ "$OLD" = "$NEW" ]; then
            echo "protocol-tag-guard ok — this push does not change PROTOCOL_VERSION."
            exit 0
          fi
          git fetch --tags --quiet || true
          if [ -n "$(git tag -l "v0.${NEW}.*")" ]; then
            echo "protocol-tag-guard ok — bump to protocol ${NEW} and a v0.${NEW}.* tag exists."
          else
            echo "::error title=Untagged protocol bump::This push changes PROTOCOL_VERSION (${OLD:-<none>} → ${NEW}) but no v0.${NEW}.* tag exists. Governance rule (protocol-governance, Release coupling): a protocol bump on main must ship with its release tag — tag v0.${NEW}.<patch> so publish-wasm ships the packages the editor pins. Nine bumps (protocols 52–60) went untagged exactly this way during the 2026 npm-token outage."
            exit 1
          fi

  # Audit 17082026 finding A4 / backlog 2.9 — the PDF-export golden lane
  # (corpus/generated/export-diff.sh, in-tree since 2026-06-04), finally
  # wired to a REAL gate. The lane exports each generated fixture to PDF,
  # rasterises it with poppler, renders the same scene with the CPU
  # renderer, and pixel-diffs the two (self-consistency: exporter vs
  # renderer — NOT the InDesign fidelity gate in fidelity.yml).
  #
  # Runtime, measured 2026-08-18: 227 pages across 33 fixtures, ~90 s for
  # the diff loop + the release builds of paged-export/paged-inspect/
  # paged-diff (cache-friendly; ~2.5 min wall warm locally). Comparable to
  # the corpus job in fidelity.yml, so it runs on every PR — no label
  # gating needed.
  #
  # CMYK profile: the script uses ONE profile on BOTH sides (exporter tags
  # ICCBased(N4), renderer converts through the same), so parity holds for
  # any reasonable CMYK profile. CI fetches Ghostscript's freely-licensed
  # SWOP profile from the PINNED ghostpdl release tag (verified: the full
  # lane under this profile reproduces the local FOGRA39 results). Without
  # ANY profile, poppler's naive DeviceCMYK diverges from the renderer's
  # profile conversion by design (measured: swatches ΔE 5.5) — so if the
  # fetch ever fails, the lane DEGRADES TO ADVISORY with a loud warning
  # instead of hard-failing on a colour-management artifact (the same
  # honest degradation the third-party-sample lane in fidelity.yml uses
  # for absent assets).
  #
  # KNOWN PRE-EXISTING DRIFT (audit A4; measured 2026-08-18, both with
  # FOGRA39 and with the GS SWOP profile — profile-independent):
  #   effects   p16 ΔE 2.19 / p17 ΔE 2.09 / p22 ΔE 3.23  (v1 exporter gap:
  #             inner-shadow/glow/bevel/satin/feather commands are
  #             documented not-yet-exported — see page.rs walk())
  #   footnotes p1 SSIM 0.921 (< 0.93)
  #   swatches  p1/p3 ΔE 1.53 (hovers at the 1.5 ceiling; profile-
  #             sensitive spot-ink pages — 1.53 GS vs 1.85 FOGRA on p2)
  # These three fixtures run in a separate ADVISORY step below so the
  # drift stays loudly visible without blocking unrelated work; every
  # other fixture is a HARD gate. Thresholds are NOT loosened (repo rule:
  # never loosen a fidelity threshold to hide a regression) — draining
  # the advisory list back into the hard set is the tracked follow-up.
  export-diff:
    name: pdf export-diff gate
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2

      - name: install poppler-utils (pdftoppm)
        # Bounded, and apt only when the tool is actually absent.
        # 2026-08-19: GitHub's Ubuntu runners were intermittently unable
        # to reach the archive — azure.archive.ubuntu.com answers `Ign:`
        # and apt then waits indefinitely. Three unbounded calls hung
        # that day (editor's playwright --with-deps for its job's full
        # 50-minute timeout on EVERY run for a month; core's wasm-size
        # gate for 70 minutes against a <3-minute norm; this one for 32
        # against 5-7). In two of the three the package was already on
        # the image, so the call was pure risk for no benefit.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if command -v pdftoppm >/dev/null 2>&1; then
            echo "pdftoppm already present ($(command -v pdftoppm)) — skipping apt"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
          fi

      - name: fetch CMYK profile (Ghostscript SWOP, pinned release tag)
        id: profile
        run: |
          set -uo pipefail
          if curl -fsSL --retry 3 -o /tmp/default_cmyk.icc \
              "https://raw.githubusercontent.com/ArtifexSoftware/ghostpdl/ghostpdl-10.05.1/iccprofiles/default_cmyk.icc"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "CMYK profile fetched ($(stat -c '%s' /tmp/default_cmyk.icc) bytes)."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=export-diff degraded to advisory::CMYK profile fetch failed — without a shared profile poppler's naive DeviceCMYK diverges from the renderer by design, so this run gates nothing (advisory). Fix the fetch to restore the hard gate."
          fi

      # The lane diffs against the gitignored corpus/generated/*.idml
      # fixtures — regenerate them exactly like the test jobs do.
      - name: regenerate fixtures
        run: bash scripts/regen-fixtures.sh

      - name: export-diff gate (hard; all fixtures minus known drift)
        env:
          PROFILE_FOUND: ${{ steps.profile.outputs.found }}
        run: |
          set -euo pipefail
          # Known-drift fixtures run ADVISORY in the next step — keep
          # this list in sync with the job header comment.
          KNOWN_DRIFT="effects footnotes swatches"
          gate=()
          for f in corpus/generated/*.idml; do
            n=$(basename "$f" .idml)
            case " $KNOWN_DRIFT " in
              *" $n "*) ;;
              *) gate+=("$n") ;;
            esac
          done
          echo "hard-gating ${#gate[@]} fixtures (advisory: $KNOWN_DRIFT)"
          if [ "$PROFILE_FOUND" = "true" ]; then
            export PAGED_CMYK_PROFILE=/tmp/default_cmyk.icc
          else
            # No shared profile → colour parity is unmeasurable; run
            # advisory rather than fail on a CM artifact (see header).
            export IDML_EXPORT_DIFF_GATE=advisory
          fi
          ./corpus/generated/export-diff.sh "${gate[@]}"

      - name: export-diff known-drift fixtures (advisory)
        if: ${{ !cancelled() }}
        env:
          PROFILE_FOUND: ${{ steps.profile.outputs.found }}
        run: |
          set -euo pipefail
          KNOWN_DRIFT="effects footnotes swatches"
          if [ "$PROFILE_FOUND" = "true" ]; then
            export PAGED_CMYK_PROFILE=/tmp/default_cmyk.icc
          fi
          export IDML_EXPORT_DIFF_GATE=advisory
          # shellcheck disable=SC2086
          ./corpus/generated/export-diff.sh $KNOWN_DRIFT | tee /tmp/export-diff-advisory.txt
          {
            echo "## PDF export-diff — known-drift fixtures (ADVISORY)"
            echo ""
            echo '```'
            cat /tmp/export-diff-advisory.txt
            echo '```'
            echo ""
            echo "Pre-existing drift recorded by audit 17082026 (A4); these fixtures do not"
            echo "block merges until the drift is fixed and they rejoin the hard gate above."
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q FAIL /tmp/export-diff-advisory.txt; then
            echo "::warning title=export-diff known drift::effects/footnotes/swatches still exceed the export-diff thresholds (audit 17082026 A4). Advisory only — fix the drift, then move them back into the hard gate."
          fi

      - name: upload diff output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-diff-output
          # Per-fixture exported PDF + poppler + native rasters — enough
          # to triage any exporter/renderer divergence.
          path: /tmp/paged-export-diff
          if-no-files-found: warn
          retention-days: 14
