name: publish-wasm

# Builds the engine's wasm-bindgen surfaces and publishes them as
# versioned npm packages that the (private) editor consumes across the
# package boundary — "decision B" of the migration plan: the editor never
# takes a Rust path dependency on the engine; it depends on these packages.
#
# AUTHENTICATION: npm trusted publishing (OIDC) — there is no NPM_TOKEN.
#
# Each of the four packages carries a Trusted Publisher on npmjs.com naming
# this org, this repo, and THIS FILENAME (`publish-wasm.yml`). At publish
# time npm asks GitHub for a short-lived OIDC token and exchanges it for
# publish rights, so nothing long-lived is stored and nothing expires.
#
# Renaming this file, or publishing these packages from another workflow,
# breaks authentication — the npm-side config is keyed on the filename.
#
# The secret it replaced had lapsed and taken v0.51.0, v0.51.1 and v0.51.2
# with it: each was tagged, built for ~11 minutes, then died on `npm error
# 404 ... PUT .../@paged-media%2fcanvas-wasm`. E404-on-PUT is what npm
# answers an unauthenticated publish — it will not admit a package exists to
# a caller who cannot see it — so all three were one expired token wearing a
# "not found" costume, while npm kept serving 0.51.0 to the editor.
#
# Still required, and not automatic:
#   1. Tag a release, e.g. `git tag v0.1.0 && git push --tags`. The package
#      version is derived from the tag.
#   2. In the editor repo, point `packages/client` at the published
#      `@paged-media/canvas-wasm` (and devtools at
#      `@paged-media/introspect-wasm`) instead of `build-wasm.sh` output.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Declaring this block sets every unlisted scope to none, so `contents: read`
# is load-bearing for checkout.
permissions:
  id-token: write # the OIDC token trusted publishing exchanges
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail on a broken publishing setup in seconds, not after the build.
      #
      # OIDC has no `npm whoami` equivalent — the exchange happens inside
      # `npm publish` — but the token ENDPOINT only exists when
      # `permissions: id-token: write` is in effect, so its absence proves
      # every publish below would fail after the full ~11-minute build.
      #
      # This is the first of three preflights: the endpoint's existence,
      # then npm's version (after setup-node, which decides which npm
      # runs), then the actual per-package OIDC exchange.
      - name: preflight — OIDC must be in effect
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo '::error::No OIDC token endpoint — permissions.id-token: write is not in effect.'
            echo '::error::Every npm publish below would fail after the full build.'
            exit 1
          fi
          echo "OIDC token endpoint present"

      # Node 24, not 20: trusted publishing needs npm >= 11.5.1, and Node 24
      # bundles npm 11.x (Node 20/22 carry npm 10.x). The runs were also
      # warning that Node 20 is deprecated on GitHub runners.
      #
      # `registry-url` is kept — it writes the .npmrc registry config the
      # publish needs — but no NODE_AUTH_TOKEN is passed to it, which is
      # exactly the trusted-publishing shape.
      #
      # Hoisted above the Rust steps together with its check, so BOTH
      # preflights run before anything expensive. It used to sit after a
      # multi-minute `cargo install wasm-bindgen-cli`, which is precisely
      # the cost this lane keeps paying to learn it cannot publish.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The other half of the preflight, here because setup-node decides
      # which npm runs. An older npm DOES NOT ERROR on trusted publishing —
      # it has never heard of it, silently falls back to token auth, and
      # with no token fails as the same misleading E404-on-PUT this lane
      # spent three releases misreading. Assert rather than assume.
      - name: preflight — npm must know about trusted publishing
        run: |
          set -euo pipefail
          NPM_V="$(npm --version)"
          echo "npm ${NPM_V}"
          if [ "$(printf '11.5.1\n%s\n' "$NPM_V" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm ${NPM_V} predates trusted publishing (needs >= 11.5.1)."
            echo "::error::It would not error — it would fall back to token auth and fail as a 404."
            exit 1
          fi

      # Do the OIDC exchange npm will do, per package, and demand an answer.
      #
      # This exists because npm's OIDC helper is SILENT on every failure
      # path: `lib/utils/oidc.js` logs at verbose/silly and returns
      # undefined, after which publish falls back to whatever token is
      # configured. setup-node's `registry-url` writes a placeholder
      # NODE_AUTH_TOKEN, so the fallback is a garbage credential and the
      # only thing the log shows is npm's E404-on-PUT — which reads as
      # "package missing" and is really "trusted publishing never happened".
      # v0.61.0 died exactly that way with a correct workflow.
      #
      # So we ask the registry the same question, per package, and print
      # what it says. The response carries a real npm token on success; it
      # is never echoed, only its presence is asserted.
      - name: preflight — the trusted publisher must answer for every package
        run: |
          set -euo pipefail
          AUD="npm:registry.npmjs.org"
          ID_TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}" | jq -r '.value // empty')"
          if [ -z "$ID_TOKEN" ]; then
            echo "::error::GitHub would not issue an OIDC id-token for audience ${AUD}."
            exit 1
          fi
          echo "id-token issued for ${AUD}"

          # Print the claims npm matches a Trusted Publisher against. These
          # are the ONLY values that can disagree with the npmjs.com form,
          # and guessing which one differs costs a round-trip each time.
          # Claims only — never the token. `repository` is the string the
          # form's org+repo fields must reconstruct, and `job_workflow_ref`
          # carries the workflow FILENAME npm keys on. An `environment`
          # claim appears only when the job declares one; if the form names
          # an environment and this is null, that is the mismatch.
          PAYLOAD="$(printf '%s' "$ID_TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          case $(( ${#PAYLOAD} % 4 )) in 2) PAYLOAD="${PAYLOAD}==";; 3) PAYLOAD="${PAYLOAD}=";; esac
          printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null \
            | jq '{repository, repository_owner, workflow_ref, job_workflow_ref, event_name, ref, environment, sub, aud}' \
            || echo "  (could not decode claims)"

          FAILED=0
          for PKG in canvas-wasm introspect-wasm sdk idml-viewer; do
            CODE="$(curl -sS -o /tmp/exch.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${ID_TOKEN}" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@paged-media%2f${PKG}")"
            if [ "$CODE" = "200" ] && [ -n "$(jq -r '.token // empty' /tmp/exch.json)" ]; then
              echo "  OK    @paged-media/${PKG}"
            else
              MSG="$(jq -r '.message // .error // empty' /tmp/exch.json 2>/dev/null || true)"
              echo "::error::@paged-media/${PKG}: OIDC exchange returned HTTP ${CODE} — ${MSG:-no message}"
              FAILED=1
            fi
            rm -f /tmp/exch.json
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::Trusted Publisher config must name org 'paged-media', repo 'core',"
            echo "::error::and workflow filename 'publish-wasm.yml' EXACTLY, on each package above."
            exit 1
          fi

      # The version is the tag, so a run on anything else must not reach the
      # publish. `workflow_dispatch` accepts any ref: dispatched from main
      # this used to resolve `version=main`, build for eleven minutes, and
      # offer npm a package versioned "main". Dispatch against a TAG ref
      # (`gh workflow run publish-wasm.yml --ref v0.61.0`) still works.
      - name: Resolve version from tag
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::ref ${GITHUB_REF_NAME} is a ${GITHUB_REF_TYPE}, not a tag — nothing to version a release from."
            exit 1
          fi
          if ! printf '%s' "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH[-prerelease]."
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # W0.9 dist-tag rider (protocol-governance §4): prerelease tags
      # (`v0.N.0-rc.x` — anything with a `-suffix`) publish under the
      # `next` dist-tag, never `latest`. A clean `0.N.P` publishes under
      # npm's default (`latest`). This sets a `dist-tag` output the
      # publish step appends as `--tag` only for prereleases.
      - name: Derive npm dist-tag from version
        id: disttag
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          if [[ "$V" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease version '$V' → npm dist-tag 'next' (not latest)"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "release version '$V' → npm dist-tag 'latest' (default)"
          fi

      # Pin the toolchain from rust-toolchain.toml (audit B21) — the
      # published wasm must be built with the same compiler the rest of
      # CI uses, not a drifting `@stable`.
      - name: resolve pinned toolchain
        id: pin
        run: echo "channel=$(bash scripts/rust-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli (lockfile pin) + binaryen (pinned)
        run: |
          set -euo pipefail
          WB=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = "|"/,""); print; exit}' Cargo.lock)
          echo "wasm-bindgen pin: $WB"
          cargo install wasm-bindgen-cli --version "$WB" --locked
          # Do NOT use apt's binaryen: ubuntu-latest ships v116, which
          # miscompiles wasm-bindgen's reference-types tables ("Table.grow
          # failed" at runtime). Same pin as docs' pages.yml.
          BINARYEN=126
          curl -fsSL -o /tmp/binaryen.tgz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN}/binaryen-version_${BINARYEN}-x86_64-linux.tar.gz"
          tar -xzf /tmp/binaryen.tgz -C /tmp
          echo "/tmp/binaryen-version_${BINARYEN}/bin" >> "$GITHUB_PATH"
          "/tmp/binaryen-version_${BINARYEN}/bin/wasm-opt" --version

      - name: Build @paged-media/canvas-wasm
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-unknown-unknown -p paged-canvas-wasm --features gpu
          OUT=dist/canvas-wasm
          mkdir -p "$OUT"
          wasm-bindgen target/wasm32-unknown-unknown/release/paged_canvas_wasm.wasm \
            --target web --out-dir "$OUT"
          wasm-opt -Oz "$OUT/paged_canvas_wasm_bg.wasm" -o "$OUT/paged_canvas_wasm_bg.wasm.opt" \
            && mv "$OUT/paged_canvas_wasm_bg.wasm.opt" "$OUT/paged_canvas_wasm_bg.wasm"
          node -e "require('fs').writeFileSync('$OUT/package.json', JSON.stringify({
            name: '@paged-media/canvas-wasm',
            version: '${{ steps.ver.outputs.version }}',
            type: 'module',
            main: 'paged_canvas_wasm.js',
            types: 'paged_canvas_wasm.d.ts',
            files: ['paged_canvas_wasm.js','paged_canvas_wasm_bg.wasm','paged_canvas_wasm.d.ts'],
            license: 'MPL-2.0 OR LicenseRef-PMEL'
          }, null, 2))"

      - name: Build @paged-media/introspect-wasm
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-unknown-unknown -p paged-introspect-wasm
          OUT=dist/introspect-wasm
          mkdir -p "$OUT"
          wasm-bindgen target/wasm32-unknown-unknown/release/paged_introspect_wasm.wasm \
            --target web --out-dir "$OUT"
          wasm-opt -Oz "$OUT/paged_introspect_wasm_bg.wasm" -o "$OUT/paged_introspect_wasm_bg.wasm.opt" \
            && mv "$OUT/paged_introspect_wasm_bg.wasm.opt" "$OUT/paged_introspect_wasm_bg.wasm"
          # The static capability catalog (ADR 019) ships alongside the wasm so
          # build-time consumers (plugin SDK sync, state ingest) read it without
          # booting wasm; describeCatalog() returns the same data at runtime.
          cp crates/paged-introspect/catalog.json "$OUT/catalog.json"
          node -e "require('fs').writeFileSync('$OUT/package.json', JSON.stringify({
            name: '@paged-media/introspect-wasm',
            version: '${{ steps.ver.outputs.version }}',
            type: 'module',
            main: 'paged_introspect_wasm.js',
            types: 'paged_introspect_wasm.d.ts',
            files: ['paged_introspect_wasm.js','paged_introspect_wasm_bg.wasm','paged_introspect_wasm.d.ts','catalog.json'],
            license: 'MPL-2.0 OR LicenseRef-PMEL'
          }, null, 2))"

      - name: Subset audit — paged-sdk must not link editor crates
        run: |
          set -euo pipefail
          # "Sibling, not a shrunk app": the viewer/SDK wasm is
          # renderer-core only. Any of these in its dependency tree is
          # a boundary breach — fail loudly.
          TREE=$(cargo tree -p paged-sdk --target wasm32-unknown-unknown --features gpu -e normal)
          if echo "$TREE" | grep -E "paged-(mutate|canvas|script)"; then
            echo "::error::paged-sdk wasm links an editor crate"; exit 1
          fi
          echo "subset audit OK — no paged-mutate/-canvas/-script in the tree"

      - name: Build @paged-media/sdk (paged-sdk WebGPU ViewerSession)
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-unknown-unknown -p paged-sdk --features gpu
          OUT=dist/sdk
          mkdir -p "$OUT"
          wasm-bindgen target/wasm32-unknown-unknown/release/paged_sdk.wasm \
            --target web --out-dir "$OUT"
          wasm-opt -Oz "$OUT/paged_sdk_bg.wasm" -o "$OUT/paged_sdk_bg.wasm.opt" \
            && mv "$OUT/paged_sdk_bg.wasm.opt" "$OUT/paged_sdk_bg.wasm"
          # Size ratchet (§4.2): print opt + brotli sizes next to the
          # recorded baseline (2026-06-06: opt 7.20 MB, brotli 2.21 MB).
          brotli -k -q 11 "$OUT/paged_sdk_bg.wasm"
          ls -la "$OUT"/paged_sdk_bg.wasm*
          node -e "require('fs').writeFileSync('$OUT/package.json', JSON.stringify({
            name: '@paged-media/sdk',
            version: '${{ steps.ver.outputs.version }}',
            type: 'module',
            main: 'paged_sdk.js',
            types: 'paged_sdk.d.ts',
            files: ['paged_sdk.js','paged_sdk_bg.wasm','paged_sdk.d.ts'],
            license: 'MPL-2.0 OR LicenseRef-PMEL'
          }, null, 2))"
          rm -f "$OUT/paged_sdk_bg.wasm.br"

      - name: Build @paged-media/idml-viewer (TS wrapper + bundled wasm)
        run: |
          set -euo pipefail
          cd web/idml-viewer
          npm install --no-fund --no-audit
          npm test
          npm run build
          mkdir -p wasm
          cp ../../dist/sdk/paged_sdk.js ../../dist/sdk/paged_sdk_bg.wasm ../../dist/sdk/paged_sdk.d.ts wasm/
          npm pkg set version="${{ steps.ver.outputs.version }}"

      # No `env:` — trusted publishing authenticates from the job's OIDC
      # token. Setting NODE_AUTH_TOKEN here would put a credential back in
      # front of the thing that replaced it.
      - name: Publish
        run: |
          set -euo pipefail
          # Leading ./ is load-bearing: a bare `dist/canvas-wasm` is
          # parsed by npm as a GitHub owner/repo shorthand, not a path
          # (it tried git ls-remote github.com/dist/canvas-wasm.git).
          #
          # --tag from the dist-tag rider (W0.9): prereleases land on
          # `next`, releases on `latest`. Passing `--tag latest`
          # explicitly is a no-op vs npm's default, so the command is
          # uniform either way.
          #
          # These run in sequence with `set -e`, and each package
          # authenticates against ITS OWN Trusted Publisher entry — so a
          # package configured wrongly on npmjs.com stops the run with the
          # earlier ones already published. That is a partial release, and
          # the fix is to configure it and re-run the tag, not to re-tag.
          # --loglevel verbose is not noise-for-its-own-sake: npm's OIDC
          # helper reports EVERY failure at verbose/silly and then silently
          # falls back to token auth. At the default level a broken trusted
          # publisher is indistinguishable from a missing package.
          TAG="${{ steps.disttag.outputs.tag }}"
          echo "publishing under npm dist-tag: $TAG"
          npm publish --loglevel verbose --access public --tag "$TAG" ./dist/canvas-wasm
          npm publish --loglevel verbose --access public --tag "$TAG" ./dist/introspect-wasm
          npm publish --loglevel verbose --access public --tag "$TAG" ./dist/sdk
          npm publish --loglevel verbose --access public --tag "$TAG" ./web/idml-viewer
